<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>miku_nexus — Admin</title><meta name="theme-color" content="#000000"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg-0:#000000;--bg-1:#080809;--bg-2:#0f0f12;--text-white:#ffffff;--text-gray:#a8a8b0;--text-dim:#808088;--cyan:#00d4ff;--purple:#7c3aed;--pink:#ff006e;--green:#10b981}html{scroll-behavior:smooth;overflow-x:hidden}body{background:linear-gradient(180deg,var(--bg-0) 0%,var(--bg-1) 50%,var(--bg-0) 100%);color:var(--text-white);font-family:'Inter',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle 500px at 20% 40%,rgba(0,212,255,0.08) 0%,transparent 50%),radial-gradient(circle 600px at 80% 60%,rgba(124,58,237,0.06) 0%,transparent 50%);pointer-events:none;z-index:0;animation:gradientShift 15s ease-in-out infinite}@keyframes gradientShift{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,50px)}}.login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(10px)}.login-screen.hidden{display:none}.login-box{background:rgba(0,0,0,0.8);border:1px solid rgba(0,212,255,0.2);border-radius:16px;padding:60px 50px;max-width:400px;width:100%;backdrop-filter:blur(20px);animation:slideUp 0.6s cubic-bezier(0.34,1.56,0.64,1)}@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}.login-title{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;margin-bottom:12px;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.login-subtitle{color:var(--text-dim);font-size:13px;margin-bottom:32px}.login-form{display:flex;flex-direction:column;gap:16px}.login-input{padding:14px 16px;border-radius:8px;border:1px solid rgba(0,212,255,0.2);background:rgba(0,212,255,0.05);color:var(--text-white);font-family:'JetBrains Mono',monospace;font-size:13px;transition:all 0.3s}.login-input:focus{outline:0;border-color:var(--cyan);background:rgba(0,212,255,0.1);box-shadow:0 0 20px rgba(0,212,255,0.1)}.login-btn{padding:14px;border-radius:8px;border:0;background:linear-gradient(135deg,var(--cyan),var(--purple));color:var(--bg-0);font-weight:700;font-size:13px;cursor:pointer;text-transform:uppercase;letter-spacing:0.5px;transition:all 0.3s;margin-top:8px}.login-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,212,255,0.2)}.login-error{color:#ef4444;font-size:12px;margin-top:12px;display:none;text-align:center}.login-error.show{display:block}main{position:relative;z-index:2;min-height:100vh;padding:40px}.dashboard-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:60px;padding-bottom:20px;border-bottom:1px solid rgba(0,212,255,0.1);flex-wrap:wrap;gap:20px}.dashboard-title{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.logout-btn{padding:10px 20px;border-radius:6px;border:1px solid rgba(0,212,255,0.3);background:rgba(0,212,255,0.1);color:var(--cyan);cursor:pointer;font-size:11px;font-weight:700;text-transform:uppercase;transition:all 0.3s}.logout-btn:hover{background:rgba(0,212,255,0.2);box-shadow:0 0 20px rgba(0,212,255,0.2)}.admin-section{margin-bottom:60px;background:rgba(0,212,255,0.02);border:1px solid rgba(0,212,255,0.08);border-radius:12px;padding:32px}.section-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--cyan);margin-bottom:24px;display:flex;align-items:center;gap:10px}.section-title::before{content:'';width:3px;height:20px;background:var(--cyan);border-radius:2px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}@media (max-width:1024px){.form-grid{grid-template-columns:1fr}}.form-group{display:flex;flex-direction:column}.form-label{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}.form-input{padding:12px;border-radius:6px;border:1px solid rgba(0,212,255,0.2);background:rgba(0,212,255,0.03);color:var(--text-white);font-family:'Inter',sans-serif;font-size:13px;transition:all 0.3s}.form-input:focus{outline:0;border-color:var(--cyan);background:rgba(0,212,255,0.08);box-shadow:0 0 15px rgba(0,212,255,0.1)}.form-textarea{padding:12px;border-radius:6px;border:1px solid rgba(0,212,255,0.2);background:rgba(0,212,255,0.03);color:var(--text-white);font-family:'JetBrains Mono',monospace;font-size:12px;resize:vertical;min-height:100px;transition:all 0.3s}.form-textarea:focus{outline:0;border-color:var(--cyan);background:rgba(0,212,255,0.08)}.full-width{grid-column:1/-1}.save-btn{width:100%;padding:14px;border-radius:8px;border:0;background:linear-gradient(135deg,var(--cyan),var(--purple));color:var(--bg-0);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;transition:all 0.3s;margin-top:20px}.save-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,212,255,0.2)}.success-msg{background:rgba(16,185,129,0.1);border:1px solid var(--green);color:var(--green);padding:12px 16px;border-radius:6px;font-size:12px;margin-top:16px;display:none}.success-msg.show{display:block;animation:slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1)}@media (max-width:768px){main{padding:20px}.admin-section{padding:20px}.dashboard-header{flex-direction:column;gap:16px}.dashboard-title{font-size:24px}}</style></head><body><div class="login-screen" id="ls"><div class="login-box"><h1 class="login-title">🔐</h1><p class="login-subtitle">Admin Access</p><form class="login-form" id="lf"><input type="password" class="login-input" id="pi" placeholder="Enter password..." required><button type="submit" class="login-btn">Access</button><div class="login-error" id="le">❌ Invalid!</div></form></div></div><main id="db" style="display:none"><div class="dashboard-header"><h1 class="dashboard-title">Admin Panel</h1><button class="logout-btn" id="lb">Logout</button></div><div class="admin-section"><h2 class="section-title">🎯 Hero</h2><div class="form-grid"><div class="form-group full-width"><label class="form-label">Title</label><input type="text" class="form-input" id="ht"></div><div class="form-group full-width"><label class="form-label">Description</label><textarea class="form-textarea" id="hd"></textarea></div></div><button class="save-btn" onclick="s1()">Save</button><div class="success-msg" id="s1m">✓ Saved!</div></div><div class="admin-section"><h2 class="section-title">🎵 Music</h2><div class="form-grid"><div class="form-group full-width"><label class="form-label">Music URL</label><input type="text" class="form-input" id="mu"></div><div class="form-group full-width"><label class="form-label">Song Name</label><input type="text" class="form-input" id="mt"></div></div><button class="save-btn" onclick="s2()">Save</button><div class="success-msg" id="s2m">✓ Saved!</div></div><div class="admin-section"><h2 class="section-title">💼 Projects</h2><div class="form-grid"><div class="form-group full-width"><label class="form-label">Project 1 Title</label><input type="text" class="form-input" id="p1t"></div><div class="form-group full-width"><label class="form-label">Project 1 Desc</label><textarea class="form-textarea" id="p1d"></textarea></div><div class="form-group full-width"><label class= al function buildFuture() return "impact" end',c3:'async fn ship_code() { }',c4:'if __name__ == "__main__": deploy()',c5:'{impact: "millions"}',c6:'print("Global recognition") -- Lua',c7:'return Promise.resolve("success");',c8:'module.exports = { engineer: "expert" };',c9:'git commit -m "Building future"',f1:'const impact = "millions";',f2:'async function ship() { }',f3:'local x = "excellence"',f4:'return <Excellence />;',gu:'https://github.com/',tu:'https://x.com/',lu:'https://linkedin.com/',eu:'hello@miku-nexus.dev',at:'I\'m 18, from Belgium...',yc:'5',ps:'40',gc:'15',cc:'15'};function ld(){const sv=JSON.parse(localStorage.getItem('pad'))||dd;Object.keys(sv).forEach(k=>{const el=document.getElementById(k);if(el)el.value=sv[k];});}function sv(d){const ad=JSON.parse(localStorage.getItem('pad'))||dd;Object.assign(ad,d);localStorage.setItem('pad',JSON.stringify(ad));sessionStorage.setItem('pd',JSON.stringify(ad));}function sh(id){const msg=document.getElementById(id);msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),2000);}function s1(){sv({ht:document.getElementById('ht').value,hd:document.getElementById('hd').value});sh('s1m');}function s2(){sv({mu:document.getElementById('mu').value,mt:document.getElementById('mt').value});sh('s2m');}function s3(){sv({p1t:document.getElementById('p1t').value,p1d:document.getElementById('p1d').value,p2t:document.getElementById('p2t').value,p2d:document.getElementById('p2d').value,p3t:document.getElementById('p3t').value,p3d:document.getElementById('p3d').value,p4t:document.getElementById('p4t').value,p4d:document.getElementById('p4d').value});sh('s3m');}function s4(){sv({c1:document.getElementById('c1').value,c2:document.getElementById('c2').value,c3:document.getElementById('c3').value,c4:document.getElementById('c4').value,c5:document.getElementById('c5').value,c6:document.getElementById('c6').value,c7:document.getElementById('c7').value,c8:document.getElementById('c8').value,c9:document.getElementById('c9').val
